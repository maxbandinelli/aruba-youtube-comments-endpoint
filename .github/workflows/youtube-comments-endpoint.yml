name: YouTube comments endpoint

on:
  workflow_dispatch:
  schedule:
    # Ogni giorno alle 05:00 UTC
    - cron: "0 5 * * *"

permissions:
  contents: write

jobs:
  update-youtube-comments:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate YouTube comments JSON
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          MAX_RESULTS: "30"
        run: |
          mkdir -p output
          python3 scripts/youtube_comments_monitor.py

      - name: Move generated files to output
        run: |
          mkdir -p output
          if [ -f public/youtube-comments-latest.json ]; then
            mv public/youtube-comments-latest.json output/youtube-comments-latest.json
          fi
          if [ -f public/youtube-comments-digest.md ]; then
            mv public/youtube-comments-digest.md output/youtube-comments-digest.md
          fi

      - name: Commit updated files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add output/youtube-comments-latest.json output/youtube-comments-digest.md
          git commit -m "Update YouTube comments endpoint" || echo "No changes to commit"
          git push
